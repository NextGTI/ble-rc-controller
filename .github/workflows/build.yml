name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(grep '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ble-rc-controller-${{ steps.ver.outputs.v }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ble-rc-controller-*-android.apk
          retention-days: 90

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(grep '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent "BLE RC Controller.app" "$GITHUB_WORKSPACE/ble-rc-controller-${{ steps.ver.outputs.v }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ble-rc-controller-*-macos.zip
          retention-days: 90

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(grep '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ble-rc-controller-${{ steps.ver.outputs.v }}-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ble-rc-controller-*-windows.zip
          retention-days: 90
